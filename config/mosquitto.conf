# ==========================================
# Secure IoT Monitoring System
# Mosquitto Configuration
# ==========================================

# Listen for secure MQTT connections
listener 8883

# ==========================================
# TLS CONFIGURATION
# ==========================================

cafile certs/ca.crt
certfile certs/broker.crt
keyfile certs/broker.key

tls_version tlsv1.2

# Require clients to present certificates
require_certificate true

# Use certificate identity as username
use_identity_as_username true

# ==========================================
# AUTHENTICATION
# ==========================================

allow_anonymous false

password_file passwords.txt

# ==========================================
# LOGGING
# ==========================================

log_dest file logs/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information

# ==========================================
# PERSISTENCE
# ==========================================

persistence true
persistence_location data/

# ==========================================
# SECURITY LIMITS
# ==========================================

max_connections 100

# Prevent retained-message abuse
retain_available true